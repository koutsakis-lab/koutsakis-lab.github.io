# Co-author name disambiguation for the publications page.
#
# Intentionally empty: co-author names are not linked out on the Publications
# page. _layouts/bib.liquid only renders a link when an entry exists here for
# a matching last name, so leaving this empty disables all co-author links
# without touching the template.
#
# To re-enable a link for someone:
#   "lastname":
#     - firstname: ["Full Name", "F.", "F. M."]
#       url: https://their-page.example.edu
